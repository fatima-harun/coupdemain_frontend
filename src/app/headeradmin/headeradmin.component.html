<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <!-- Logo -->
    <a class="navbar-brand ms-3" href="#">
      <img src="assets/img/logo_coupdemain.png" alt="Logo" class="ms-4">
    </a>

    <!-- Toggle button pour le mode responsive -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Contenu de la navbar -->
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <!-- Liens principaux -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '/portail'}" (click)="setActivePage()" href="/portail">Accueil</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '#missions'}" (click)="setActivePage()" href="#missions">Missions</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '#guide'}" (click)="setActivePage()" href="https://youtu.be/5LA-vx4-tOo">Guide</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '/liste-offre'}" (click)="setActivePage()" href="/liste-offre">Emplois</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '/candidats'}" (click)="setActivePage()" href="/candidats">Candidats</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '/nos chiffres'}" (click)="setActivePage()" href="/nos chiffres">Nos chiffres</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" [ngClass]="{'active-link': activePage === '/offre'}" (click)="setActivePage()" href="/dashboard">Dashboard</a>
        </li>
      </ul>

      <!-- Vérification de la connexion -->
      <form class="d-flex ms-auto" *ngIf="!isLoggedIn; else loggedInTemplate">
        <div class="me-1">
          <button class="btn btn-primary"><a href="/connexion" class="text-white text-decoration-none">Se connecter</a></button>
        </div>
        <div class="me-3">
          <button class="btn btn-secondary"><a href="/inscription" class="text-white text-decoration-none">S'inscrire</a></button>
        </div>
      </form>

      <!-- Utilisateur connecté -->
      <ng-template #loggedInTemplate>
        <div class="d-flex align-items-center ms-auto">
          <!-- Menu utilisateur -->
          <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle user-btn" type="button" id="dropdownMenuButton"
                    data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fas fa-user-circle me-2"></i>
              {{ userName }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="dropdownMenuButton">
              <li><a class="dropdown-item" href="/profil">Mon profil</a></li>
              <li><a class="dropdown-item" (click)="onLogout()">Se déconnecter</a></li>
            </ul>
          </div>
        </div>
      </ng-template>
    </div>
  </div>
</nav>
