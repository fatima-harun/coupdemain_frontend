<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup de Main - Connexion</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="connexion.component.css">
</head>
<body>
  <app-header></app-header>
  <main class="container text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 img-container">
            <img src="assets/img/jardinier.png" alt="Illustration" class="img-fluid mb-3">
        </div>
        <div class="col-md-6 ">
            <div class=" carte p-4" >
                <h1>Bienvenue 👋</h1>
                <p class="paragraphe1">Que vous soyez employeur ou personnel de maison,
                     connectez-vous à votre compte et profitez des
                     nombreuses opportunités qui s'offrent à vous</p>
                <form #loginForm="ngForm">
                    <div class="form-group">
                        <label for="nom_utilisateur">Nom utilisateur</label>
                        <input type="text" class="form-control" id="nom_utilisateur" [(ngModel)]="userObject.nom_utilisateur" name="nom_utilisateur" required placeholder="Entrez votre nom d'utilisateur">
                        <div *ngIf="errors.nom_utilisateur" class="text-danger">{{ errors.nom_utilisateur }}</div>
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" class="form-control" id="password" [(ngModel)]="userObject.password" name="password" required placeholder="Entrez votre mot de passe">
                        <div *ngIf=" errors.password " class="text-danger">{{ errors.password }}</div>
                    </div>
                    <button type="submit" class="btn  btn-block mb-3" (click)="connexion()">Envoyer</button>
                </form>
                <p class="paragraphe2">Vous n'avez pas de compte ! <span>Inscrivez-vous</span></p>
            </div>
        </div>
    </div>
</main>
