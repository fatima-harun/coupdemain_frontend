<app-header></app-header>

<div class="container my-5">
  <div class="card shadow-lg mx-auto">
    <div class="card-body">
      <h2 class="mb-4">Ajouter des Compétences</h2>
      <form >
        <div class="mb-3">
          <label for="libelle" class="form-label">Libellé</label>
          <input type="text" id="libelle"  class="form-control"  name="libelle" [(ngModel)]="competenceObject.libelle">
        </div>
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea id="description"  class="form-control"name="description" [(ngModel)]="competenceObject.description"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" (click)="ajoutCompetence()">Ajouter</button>
      </form>
    </div>
  </div>
</div>

<app-footer></app-footer>
